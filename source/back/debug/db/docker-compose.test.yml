# Local test runner: spins up a throwaway Postgres and runs pytest inside a
# container, so `make test` (see README) matches CI/other machines without
# needing a local Python install. The unit tests themselves run against an
# in-memory sqlite DB (see tests/conftest.py); test-db is wired in via
# DATABASE_URL for tests that exercise the real PostgreSQL engine/migrations.
#
# Usage (from repo root):
#   docker compose -f .build/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from test
#
# test-db also runs sshd, so you can ssh straight in and poke around with
# psql. Public key comes from the host via $ARCHIEVES_TEST_SSH_PUBKEY
# (defaults to ~/.ssh/archieves_test_ed25519.pub, generate with:
# ssh-keygen -t ed25519 -f ~/.ssh/archieves_test_ed25519 -N ""). Connect with:
#   ssh -i ~/.ssh/archieves_test_ed25519 -p 52000 root@localhost
services:
  archieves-test:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archieves_test
      TZ: "Asia/Tokyo"
    ports:
      - "52000:5432"
    container_name: archieves-test
    

