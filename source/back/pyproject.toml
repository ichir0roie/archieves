[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
# The lowest interpreter the code must run on, which is what ruff reads this
# as: the deployed runtime is 3.14 (see .build/Dockerfile), but the tests also
# run on the 3.11 dev containers ship, so fixes that assume newer semantics
# (PEP 649 deferred annotations, PEP 695 generics, Generator's defaulted type
# arguments) would break the suite there.
target-version = "py311"
# Alembic writes these from a template; they are a migration history rather
# than hand-maintained source, so reformatting them would churn the history.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) in argument defaults is the documented,
# idiomatic pattern, not a real mutable-default bug.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Deliberate re-export surfaces and the star-importing debug/tooling scripts
# they exist for (see CLAUDE.md's "Debug scripts"): F403/F405 are the point,
# not a mistake.
"app/db/__init__.py" = ["F403"]
"mods/**" = ["F403", "F405"]
"debug/**" = ["F403", "F405"]
"tools/**" = ["F403", "F405"]
