# The pytest environment: `docker compose -f .build/docker-compose.test.yml run --rm tests`
#
# Separate from docker-compose.yml (which runs the API for the frontend to
# talk to) so the two can run side by side: this postgres publishes no host
# port and keeps its data in a tmpfs, since the suite rebuilds the schema on
# every run and nothing here should outlive it.
services:
  test-db:
    image: postgres:16
    command: ["postgres", "-c", "timezone=Asia/Tokyo", "-c", "fsync=off"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archieves_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d archieves_test"]
      interval: 2s
      timeout: 5s
      retries: 15

  tests:
    build:
      context: ..
      dockerfile: .build/Dockerfile.test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@test-db:5432/archieves_test
      AUTH_MODE: mock
    volumes:
      - ..:/app
    depends_on:
      test-db:
        condition: service_healthy
