# The pytest environment: `docker compose -f .build/docker-compose.test.yml run --rm tests`
#
# Separate from docker-compose.yml (which runs the API for the frontend to
# talk to) so the two can run side by side. There is no database service: the
# suite builds its schema into an in-memory sqlite DB per run (see
# tests/conftest.py), so nothing here outlives the container.
services:
  tests:
    build:
      context: ..
      dockerfile: .build/Dockerfile.test
    environment:
      AUTH_MODE: mock
    volumes:
      - ..:/app
