services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "timezone=Asia/Tokyo"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: archieves
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: .build/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/archieves
      # Skips Cognito so the container runs with no AWS credentials; override
      # to "cognito" (and set USERPOOL_ID/APP_CLIENT_ID) to verify real
      # tokens against a real user pool instead. See app/core/security.py.
      AUTH_MODE: mock
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
