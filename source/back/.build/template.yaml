AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  archieves-api: FastAPI packaged as a container image and run on AWS Lambda
  via the AWS Lambda Web Adapter, fronted by API Gateway (HTTP API), talking
  to an external PostgreSQL database (e.g. RDS).

Parameters:
  Stage:
    Type: String
    Default: dev
  DatabaseUrlSecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the SQLAlchemy DATABASE_URL
      connection string. The RDS instance and secret are provisioned
      separately from this template.
  VpcSubnetIds:
    Type: CommaDelimitedList
    Description: Private subnet IDs the Lambda function uses to reach PostgreSQL.
  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Description: Security group IDs attached to the Lambda function's ENIs.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512

Resources:
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      VpcConfig:
        SubnetIds: !Ref VpcSubnetIds
        SecurityGroupIds: !Ref VpcSecurityGroupIds
      Environment:
        Variables:
          PORT: "8080"
          ENV: !Ref Stage
          # NOTE: this dynamic reference is resolved by CloudFormation at
          # deploy time and the resulting value is stored as a plain Lambda
          # environment variable (visible in the console/CLI). It does not
          # follow secret rotation. For production, prefer fetching the
          # secret at runtime instead (e.g. via aws-lambda-powertools
          # `parameters` module or a boto3 secretsmanager call on cold
          # start) and pass DatabaseUrlSecretArn itself as the env var.
          DATABASE_URL: !Sub "{{resolve:secretsmanager:${DatabaseUrlSecretArn}}}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerContext: ..
      Dockerfile: .build/Dockerfile

Outputs:
  ApiUrl:
    Description: Base URL of the deployed HTTP API
    Value: !Sub "https://${ServerlessHttpApi}.execute-api.${AWS::Region}.amazonaws.com/"
